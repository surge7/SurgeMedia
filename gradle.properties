# manual source-set hierarchy (jvmShared / jvmSharedTest) — see core/build.gradle.kts
kotlin.mpp.applyDefaultHierarchyTemplate=false
# required for androidx.activity:activity-compose in :composeApp
android.useAndroidX=true
# cold-build D8/mergeExtDex OOM without this (see task-1 review finding B)
org.gradle.jvmargs=-Xmx4g
kotlin.daemon.jvmargs=-Xmx4g

# AGP 9 defaults to the new Android DSL, which forbids androidTarget() in a KMP module applying
# com.android.application (KGP 2.4.20). This project is a single-module KMP build by design —
# the restructure is deliberately deferred; this is AGP's documented temporary bypass.
android.newDsl=false
android.builtInKotlin=false
