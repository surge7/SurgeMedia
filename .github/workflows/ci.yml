name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v6
      - run: >
          ./gradlew :core:jvmTest :cli:build :composeApp:assembleDebug
          :composeApp:testDebugUnitTest :composeApp:jvmTest

  # Windows 11 x64 desktop: same jvm tests with the Windows jlibtorrent native
  # (host-conditional in core/build.gradle.kts), then package the installers.
  # WiX for the MSI/EXE is fetched by the compose plugin automatically.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v6
      # Split from packaging so one native flake doesn't block the MSI/EXE artifact upload.
      - name: JVM tests
        run: >
          ./gradlew.bat :core:jvmTest :cli:build :composeApp:jvmTest
      # Runs even when the tests above fail, and the artifact still uploads.
      - name: Package
        if: always()
        run: ./gradlew.bat :composeApp:packageDistributionForCurrentOS
      - name: Upload installers
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: SurgeMedia-windows-x64
          path: |
            composeApp/build/compose/binaries/main/msi/*.msi
            composeApp/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error
