[versions]
kotlin = "2.1.20"
coroutines = "1.10.2"
ktor = "3.1.1"
jsoup = "1.19.1"
serializationJson = "1.8.1"
jlibtorrent = "2.0.12.9"
okhttp = "4.12.0"
agp = "8.10.1"
composeMultiplatform = "1.8.1"
activityCompose = "1.9.3"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serializationJson" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
jlibtorrent = { module = "com.frostwire:jlibtorrent", version.ref = "jlibtorrent" }
jlibtorrent-macosx-arm64 = { module = "com.frostwire:jlibtorrent-macosx-arm64", version.ref = "jlibtorrent" }
jlibtorrent-linux-x8664 = { module = "com.frostwire:jlibtorrent-linux-x86_64", version.ref = "jlibtorrent" }
jlibtorrent-android-arm64 = { module = "com.frostwire:jlibtorrent-android-arm64", version.ref = "jlibtorrent" }
jlibtorrent-android-x8664 = { module = "com.frostwire:jlibtorrent-android-x86_64", version.ref = "jlibtorrent" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version = "1.0.1" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
kotlin-plugin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
